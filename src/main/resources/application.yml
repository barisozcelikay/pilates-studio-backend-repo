spring:
  application:
    name: pilates-studio-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pilates_studio_db}
    username: ${DB_USERNAME:pilates_user}
    password: ${DB_PASSWORD:pilates_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pilates_studio

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
    liquibase-schema: pilates_studio
    default-schema: pilates_studio

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-local-secret-to-a-long-random-value}
  expiration: ${JWT_EXPIRATION:3600}
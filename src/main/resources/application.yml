spring:
  application:
    name: pilates-studio-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pilates_studio_db}
    username: ${DB_USERNAME:pilates_user}
    password: ${DB_PASSWORD:pilates_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pilates_studio

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
    liquibase-schema: pilates_studio
    default-schema: pilates_studio



  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

mail:
  from: ${MAIL_FROM:noreply@pilatesstudio.local}
  from-name: ${MAIL_FROM_NAME:Pilates Studio}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-this-local-secret-to-a-long-random-value}
  expiration: ${JWT_EXPIRATION:3600}